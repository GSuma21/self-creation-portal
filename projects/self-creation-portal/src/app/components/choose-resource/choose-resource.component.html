<lib-header class="z-50" [backButton]="backButton" [headerData]="headerData"></lib-header>
<div class="mt-32 mx-4 pt-4 flex flex-col gap-2 sticky top-32 z-50 bg-white">
  <lib-search (searchEvent)="receiveSearchResults($event)" [maxLength]="150"></lib-search>
  <div>
    <lib-filter [filterData]="filters.filterData" (filteredData)="onFilterChange($event)" (sortOptionsChanged)="onSortOptionsChanged($event)"
    [changeReqCount]="filters.changeReqCount" [inprogressCount]="filters.inprogressCount" (filterButtonActionEvent)="filterButtonClickEvent($event)"
    [activeFilterButton]="filters.activeFilterButton"> </lib-filter>
  </div>
</div>
<div class="flex h-[70vh] overscroll-none z-0">
  <div class="sticky w-1/4 p-4 border-r border-gray-300 overflow-y-auto" (scroll)="onScroll($event)">
    <mat-list>
      @for(item of contentList; track item) {
      <mat-list-item class="flex items-center p-2 hover:bg-gray-200 cursor-pointer">
        <mat-radio-button class="mr-2" [value]="item.title" [checked]="selectedValue === item.title"
          (change)="onSelectionChange(item)">
          <div class="flex flex-col">
            <p class="overflow-ellipsis">{{ item.title }}</p>
            <p class="overflow-ellipsis">{{"BY" | translate}} {{item?.creator}}</p>
          </div>
        </mat-radio-button>
      </mat-list-item>
      <hr>
      }
    </mat-list>
  </div>
  <div class="sticktop w-3/4 p-4 border-r border-gray-300 bg-white flex flex-col items-center">
    @if(showPreview && !showNoResultComponent ){
      <div class="w-[80%] border border-gray-300">
        <lib-preview [inputData]="data" class="w-[100%]"></lib-preview>
      </div>
    }
    <div class="flex flex-col justify-center items-center text-center">
      @if(showNoResultComponent ){
        <lib-no-result-found [noResultMessage]="noResultMessage"></lib-no-result-found>
      }
  </div>
  </div>
</div>
@if(showPreview && !showNoResultComponent){
  <div
  class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-300 flex justify-between text-center items-center p-3">
  <p>(1) {{"CONTENT_SELECTED" | translate}}</p>
  <button class="px-4 py-2 rounded bg-primary text-white" (click)="onSelect()">
    {{ "SELECT" | translate }}
  </button>
  </div>
}
