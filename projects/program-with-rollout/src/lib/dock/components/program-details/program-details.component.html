
<div color="secondary" class="fixed top-32 w-full z-50 border-b px-10 py-2 text-lg text-tertiary bg-white">
    <span>{{"PROGRAM_DETAILS" | translate}}</span>
</div>
@if(dynamicFormData){
<div class="pd-top items-center form-container">
    <dynamic-form [formJson]="dynamicFormData" [language]=[language] [classFlex]="'flex flex-wrap gap-[6%]'" [viewOnly]="viewOnly" #formLib
        (formChange)="getDynamicFormData($event)" (controlChange)="getFormControlChange($event)"
        [allowOpenLinks]="allowOpenLinks" (onClickTriggerParent)="onClickTriggeredParent($event)" (onActionTriggerParent)="onActionTriggeredParent($event)"></dynamic-form>
</div>
}
@if(commentPayload || ResourceInReview) {
<lib-comments-box [commentPayload]="commentPayload" [resourceId]="programId" [messages]="commentsList" [mode]="mode"
    (comment)="saveComment($event)"></lib-comments-box>
}
