<form [formGroup]="resourceForm">
  <div formArrayName="resources" class="form-container">
    <div *ngFor="let resourceGroup of resourceFields.controls; let i=index" [formGroupName]="i">
      <mat-card appearance="outlined" class="resource-card">
        <lib-card [list]="resources[i]" [showActionButton]="true" class="mb-3"></lib-card>
        <div class="mat-mdc-form-field-infix ng-tns-c3736059725-23"><label matformfieldfloatinglabel="" class="mdc-floating-label mat-mdc-floating-label ng-tns-c3736059725-23 mdc-floating-label--float-above ng-star-inserted" ng-reflect-floating="true" ng-reflect-monitor-resize="false" id="mat-mdc-form-field-label-18" for="mat-input-8"><mat-label _ngcontent-ng-c2505383043="" class="ng-tns-c3736059725-23 ng-star-inserted target-criteria">Target criteria</mat-label><!--bindings={
          "ng-reflect-ng-if": "Target criteria"
        }--><span aria-hidden="true" class="mat-mdc-form-field-required-marker mdc-floating-label--required ng-tns-c3736059725-23 ng-star-inserted"></span><!--container--></label><!--container--><!--bindings={
          "ng-reflect-ng-template-outlet": "[object Object]"
        }--><!--container--><div _ngcontent-ng-c2505383043="" class="resource-button cursor-pointer ng-tns-c3736059725-23" (click)="openTargetCriteria(i)"><mat-icon _ngcontent-ng-c2505383043="" role="img" class="mat-icon notranslate material-icons mat-ligature-font mat-icon-no-color" aria-hidden="true" data-mat-icon-type="font">add_circle</mat-icon>&nbsp; <p _ngcontent-ng-c2505383043="">Select targeting details</p></div><div _ngcontent-ng-c2505383043="" class="flex flex-col gap-4 mt-4 ng-tns-c3736059725-23"><!--bindings={
          "ng-reflect-ng-for-of": ""
        }--></div><input _ngcontent-ng-c2505383043="" matinput="" hidden="" class="mat-mdc-input-element visibility-hidden ng-tns-c3736059725-23 ng-untouched ng-pristine ng-invalid mat-mdc-form-field-input-control mdc-text-field__input cdk-text-field-autofill-monitored" ng-reflect-name="targeting_criteria" ng-reflect-required="true" required="" id="mat-input-8" aria-required="true"></div>
        <!-- target criteria list -->
        <div class="flex flex-col gap-4">
          <div  *ngFor="let targetItem of resources[i]?.targeting_criteria;let j = index" class="resource-items-container">
            <section class="resouce-inner-section cursor-pointer">
              <img src="assets/images/video-icon.png" alt="My Image">&nbsp;
              <p>{{targetItem?.label}}</p>
            </section>
            <div class="cursor-pointer flex flex-row gap-2">
              <mat-icon (click)="updateResource(i,j,targetItem)" class="cursor-pointer">edit_square</mat-icon>
              <mat-icon (click)="updateResource(i,j)"class="cursor-pointer">close</mat-icon>
            </div>
          </div>
        </div>
        <section class="flex mt-4">
          <section>
            <mat-form-field appearance="outline" class="mr-3">
              <mat-label>Start Date</mat-label>
              <input matInput [matDatepicker]="startDate" readonly formControlName="start_date" placeholder="Start Date" [max]="getMaxDate(i)" [min]="getProgramDate('start_date')"  (dateChange)="setValueToProgram($event,i,'start_date')">
              <mat-datepicker-toggle matIconSuffix [for]="startDate"></mat-datepicker-toggle>
              <mat-datepicker #startDate></mat-datepicker>
            </mat-form-field>
            <mat-error *ngIf="resourceGroup.get('start_date')?.touched && resourceGroup.get('start_date')?.hasError('required')">
              Start date is required.
            </mat-error>
          </section>
          <section>
            <mat-form-field appearance="outline">
              <mat-label>End Date</mat-label>
              <input matInput [matDatepicker]="endDate" readonly formControlName="end_date" placeholder="End Date" [min]="getMinDate(i)" [max]="getProgramDate('end_date')" (dateChange)="setValueToProgram($event,i,'end_date')">
              <mat-datepicker-toggle matIconSuffix [for]="endDate"></mat-datepicker-toggle>
              <mat-datepicker #endDate></mat-datepicker>
            </mat-form-field>
            <mat-error *ngIf="resourceGroup.get('end_date')?.touched &&resourceGroup.get('end_date')?.hasError('required')">
              End date is required.
            </mat-error>
          </section>
        </section>
      </mat-card>
    </div>
  </div>
</form>
@if(resources <= 0){
  <div  class="top-32 w-full flex flex-col items-center justify-center h-[70%]">
    No resources are currently added to the program. Add resources to view the resource targeting details.
  </div>
}
