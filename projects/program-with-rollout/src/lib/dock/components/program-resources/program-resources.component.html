
<div color="secondary" class="fixed top-32 w-full z-50 border-b px-10 py-2 text-lg text-tertiary bg-white">
  <span>{{"RESOURCES" | translate}}</span>
</div>
<div class="px-10 w-[100%] flex flex-col gap-2 py-4 z-50 bg-white pt-50 mt-44">
  <div class="content-container" [ngClass]="{'pointer-events-none': viewOnly}">
    @if(isResourceTileShow){
      @for (cardItem of resourceList; track cardItem) {
        <mat-card class="custom-card" (click)="onCardClick(cardItem)">
          <mat-card-content class="img-content">
            <img src="{{ cardItem.image }}" alt="">
            <mat-card-title class="img-title">{{ cardItem.title | translate}}</mat-card-title>
        </mat-card-content>
        </mat-card>
      }
    }
  </div>
</div>
<div  class="px-10 py-4 w-[100%]">
  <p>{{"ADDED_RESOURCES" | translate}} ({{resourceCount}})</p>
</div>
<div class="px-10 py-4 w-[100%]" >
  @for(list of resources; track list){
    <div class="pb-3">
      <lib-card [list]="list" [showActionButton]="true"  [commentVisible]="(programWithRolloutService.programData.status === 'PUBLISHED' || mode === 'reviewerView' || mode === 'review') ? false : true" (buttonClickEvent)="statusButtonClick($event)"></lib-card>
    </div>
    }
</div>
@if(commentPayload || ResourceInReview) {
  <lib-comments-box [commentPayload]="commentPayload" [resourceId]="programId" [messages]="commentsList" [mode]="mode" (comment)="saveComment($event)"></lib-comments-box>
}
