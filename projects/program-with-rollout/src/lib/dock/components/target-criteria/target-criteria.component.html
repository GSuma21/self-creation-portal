<header>
    <div class="header">
      <h3 class="text-white">Choose Target Criteria</h3>
      <mat-icon class="cursor-pointer text-white" [mat-dialog-close]="false">close</mat-icon>
    </div>
</header>
<div class="main flex">
    <!-- <div class="min-h-[88vh] max-h-[100vh] sticktop">
        <lib-side-navbar [sidenavData]="dialogData.sidenavData"></lib-side-navbar>
    </div> -->
    <div class="dropdown-container">
        @for (item of criteria; track item) {
            <mat-form-field floatLabel="always" class="w-full mt-4" appearance="outline">
                <mat-label> {{ item.label}}</mat-label>
                <mat-select class="border px-2 w-40" [multiple]="item.isMultiple" [placeholder]="item.placeHolder">
                    <mat-option *ngFor="let option of item.options" [value]="option._id">
                        {{ option.name ? option.name : option?.label }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        }
        <section>
            <section>
                <mat-label>Filter :</mat-label>
                <input matInput (keyup)="applyFilter($event)" class="filter-input" placeholder="Search anything" #input>
            </section>
              <div class="mat-elevation-z8">
                <table mat-table [dataSource]="dataSource" matSort>

                    <!-- Checkbox Column -->
                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef>
                        <mat-checkbox (change)="$event ? toggleAllRows() : null"
                                        [checked]="selection.hasValue() && isAllSelected()"
                                        [indeterminate]="selection.hasValue() && !isAllSelected()"
                                        [aria-label]="checkboxLabel()">
                        </mat-checkbox>
                        </th>
                        <td mat-cell *matCellDef="let row">
                        <mat-checkbox (click)="$event.stopPropagation()"
                                        (change)="$event ? selection.toggle(row) : null"
                                        [checked]="selection.isSelected(row)"
                                        [aria-label]="checkboxLabel(row)">
                        </mat-checkbox>
                        </td>
                    </ng-container>


                  <!-- ID Column -->
                  <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                    <td mat-cell *matCellDef="let row"> {{row.id}} </td>
                  </ng-container>

                  <!-- Progress Column -->
                  <ng-container matColumnDef="progress">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Progress </th>
                    <td mat-cell *matCellDef="let row"> {{row.progress}}% </td>
                  </ng-container>

                  <!-- Name Column -->
                  <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                  </ng-container>

                  <!-- Fruit Column -->
                  <ng-container matColumnDef="fruit">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Fruit </th>
                    <td mat-cell *matCellDef="let row"> {{row.fruit}} </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)"></tr>

                  <!-- Row shown when there is no matching data. -->
                  <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
                  </tr>
                </table>

                <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
              </div>
        </section>

    </div>
</div>
<section class="flex justify-end mr-5 mb-3">
    <button mat-raised-button class="btn-submit primary-button-enable py-2 px-3">Submit</button>
</section>
