<header class="">
    <div class="header">
      <h3 class="text-white">{{"SELECT_TARGETING_DETAILS" | translate}}</h3>
      <mat-icon class="cursor-pointer text-white" [mat-dialog-close]="false">close</mat-icon>
    </div>
</header>
<mat-tab-group class="mt-9">
    @for (tab of criteria; track tab) {
        <mat-tab [label]="tab.label">
            <div class="main flex">
                <div class="dropdown-container">
                    @for (item of tab?.form; track item;let index = $index) {
                        <mat-form-field floatLabel="always" class="w-full mt-4" appearance="outline">
                            <mat-label> {{ item.label}}</mat-label>
                            <mat-select class="border px-2 w-40" [multiple]="item.isMultiple" [placeholder]="item.placeHolder" (selectionChange)="setFormData($event,item?.meta?.type,index)" [required]="item.validators?.required" [(ngModel)]="formData[item.meta.type]" [compareWith]="compareObjects" [disabled]="item.options.length == 0">
                                <mat-option *ngFor="let option of item.options" [value]="option">
                                    {{ option.name ? option.name : option?.label }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    }
                    <section *ngIf="tab?.showTable">
                        <section class="flex justify-between pt-7 mb-3">
                            <lib-search (searchEvent)="applyFilter($event)" [maxLength]="150" #input [placeHolder]="placeHolder"></lib-search>
                            <lib-filter [filterData]="criteriaFilters" (filteredData)="onFilterChange($event)" class="ml-2"></lib-filter>
                        </section>
                          <div class="mat-elevation-z8">
                            <table mat-table [dataSource]="dataSource" matSort>

                                <!-- Checkbox Column -->
                                <ng-container matColumnDef="select">
                                    <th mat-header-cell *matHeaderCellDef>
                                    <mat-checkbox (change)="$event ? toggleAllRows() : null"
                                                    [checked]="selection.hasValue() && isAllSelected()"
                                                    [indeterminate]="selection.hasValue() && !isAllSelected()"
                                                    [aria-label]="checkboxLabel()">
                                    </mat-checkbox>
                                    </th>
                                    <td mat-cell *matCellDef="let row">
                                    <mat-checkbox (click)="$event.stopPropagation()"
                                                    (change)="selectSingleRow($event,row)"
                                                    [checked]="checkIsRowAvailable(row)"
                                                    [aria-label]="checkboxLabel(row)">
                                    </mat-checkbox>
                                    </td>
                                </ng-container>

                                <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
                                    <th mat-header-cell *matHeaderCellDef><b> {{ column | titlecase  }}</b> </th>
                                    <td mat-cell *matCellDef="let element"> {{ element[column] }} </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="tableColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns:tableColumns" (click)="selection.toggle(row)"></tr>

                                <!-- Row shown when there is no matching data. -->
                                <tr class="mat-row" *matNoDataRow>
                                    <td class="mat-cell text-center py-3" colspan="4">No data available</td>
                                </tr>
                            </table>

                            <mat-paginator [pageSizeOptions]="[5,10, 25, 100]" aria-label="Select page of users" (page)="pageEvent($event)"></mat-paginator>
                          </div>
                    </section>
                </div>
            </div>
        </mat-tab>
    }
</mat-tab-group>
<section class="flex justify-end mr-5 mb-3 submit-section">
    <button mat-raised-button class="btn-submit primary-button-enable py-2 px-3" (click)="closeDialog()" [disabled]="isDisable()">Submit</button>
</section>
